name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout maps repo
        uses: actions/checkout@v7
        with:
          repository: interscript/maps
          path: _maps
      - name: Symlink maps into ../maps
        run: ln -s "$PWD/_maps" "$GITHUB_WORKSPACE/../maps"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run format:check

  isc-parity:
    name: ISC parser parity (all 289 maps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout maps repo
        uses: actions/checkout@v7
        with:
          repository: interscript/maps
          path: _maps
      - name: Symlink maps into ../maps
        run: ln -s "$PWD/_maps" "$GITHUB_WORKSPACE/../maps"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Parse all .isc files
        run: npx tsx scripts/parse-all-isc.ts
      - name: End-to-end parity (target 100%)
        run: npx vitest run test/isc/end-to-end.test.ts

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout maps repo
        uses: actions/checkout@v7
        with:
          repository: interscript/maps
          path: _maps
      - name: Symlink maps into ../maps
        run: ln -s "$PWD/_maps" "$GITHUB_WORKSPACE/../maps"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  conformance-matrix:
    name: Conformance matrix (frozen fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download fixtures (GitHub Releases channel)
        run: |
          mkdir -p fixtures && cd fixtures
          BASE="https://github.com/interscript/interscript-models/releases/download"
          curl -fsSL -o models-index.yaml "$BASE/index-v12/models-index.yaml"
          curl -fsSL -o models-index.yaml.sha256 "$BASE/index-v12/models-index.yaml.sha256"
          sha256sum -c models-index.yaml.sha256
          for v in urd-diac-base fas-diac-base urd-g2p-base; do
            curl -fsSL -O "$BASE/index-v12/$v-vectors.json"
          done
          # the two single-zip models; urd-g2p (split parts) resolves
          # via the runtime resolver in a later matrix pass
          for m in urd-diac-base-1.0 fas-diac-base-1.0; do
            url=$(sed -n "/^  $m:/,/^  [a-z]/p" models-index.yaml | grep -m1 'url:' | awk '{print $2}')
            curl -fsSL -o "$m.zip" "$url"
          done
      - name: Run the matrix
        run: |
          for pair in "urd-diac-base-1.0 urd-diac-base" "fas-diac-base-1.0 fas-diac-base"; do
            set -- $pair
            echo "::group::$1"
            SECRYST_E2E_ZIP="$PWD/fixtures/$1.zip" \
              CONFORMANCE_VECTORS="$PWD/fixtures/$2-vectors.json" \
              npx vitest run test/conformance.test.ts
            echo "::endgroup::"
          done
